<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn2Drive - Lesson Quiz</title>
  <link rel="stylesheet" href="quiz.css">
  <link rel="stylesheet" href="setting.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
<div class="container">
  <div id="quiz-page">
    <h1>Learn2Drive</h1>
    <div class="top-bar">
      <span id="progress">မေးခွန်း ၁ / ၂၉</span>
      <span id="score">ရမှတ်: ၀</span>
    </div>
    <div class="question-box"><h2 id="question"></h2></div>
    <div id="options" class="options"></div>
    <p id="feedback"></p>
    <button id="next-btn">နောက်မေးခွန်းသို့</button>
  </div>
  <div id="result-page" class="hidden">
    <h1>စမ်းသပ်မှုရလဒ်</h1>
    <div class="result-card">
      <h2 id="result-title"></h2>
      <div class="big-score" id="final-score"></div>
      <p id="percentage"></p>
      <p id="status-text"></p>
      <div class="result-buttons">
        <button id="restart-btn">ထပ်မံကြိုးစားရန်</button>
        <button id="back-btn">Portal သို့ပြန်သွားရန်</button>
      </div>
    </div>
  </div>
</div>

<script src="question.js"></script>
<script src="question-translation.js"></script>
<script src="quiz.js"></script>
<script src="setting.js"></script>
<script src="quiz-language.js"></script>
</body>
</html>
