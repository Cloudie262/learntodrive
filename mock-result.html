<!DOCTYPE html>

<html lang="my">

<head>
    <script src="i18n.js"></script>
    <script src="i18n-messages.js"></script>
    <link rel="stylesheet" href="site-settings.css">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>
        Learn2Drive - Test Result
    </title>


    <link rel="stylesheet"
          href="style.css">

    <link rel="stylesheet"
          href="setting.css">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="result-container">


    <div class="result-card">


        <div
            id="resultIcon"
            class="result-icon">

            <i class="fa-solid fa-hands-clapping"></i>

        </div>


        <h1 id="resultTitle">

            အစမ်းစာမေးပွဲ ရလဒ်

        </h1>


        <p id="resultMessage">

            <i class="fa-regular fa-circle-down"></i>

            သင်၏ အစမ်းစာမေးပွဲရလဒ်ကို အောက်တွင်ကြည့်ရှုနိုင်ပါသည်။

        </p>



        <div class="result-score">


            <span id="score">

                <i class="fa-solid fa-trophy"></i>

                ၀ / ၅၀

            </span>


            <small>
                ရမှတ်
            </small>


        </div>



        <div class="percentage">

            <span id="percentage">
                ၀%
            </span>

        </div>



        <div
            id="status"
            class="result-status">

            <i class="fa-regular fa-face-smile"></i>

            အောင်မြင်ပါသည်

        </div>



        <div class="result-buttons">


            <button id="retryBtn">

                <i class="fa-solid fa-rotate-right"></i>

                ပြန်လည်ဖြေဆိုရန်

            </button>


            <button id="homeBtn">

                <i class="fa-solid fa-house-chimney"></i>

                Portal သို့ပြန်သွားရန်

            </button>


        </div>


    </div>


</div>



<script src="mock-result.js"></script>

<script src="setting.js"></script>


<script src="quiz-language.js"></script>
</body>

</html>
