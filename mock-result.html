<!DOCTYPE html>
<html lang="my">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Learn2Drive - Test Result</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body>

<div class="result-container">

    <!-- Result Header -->

    <div class="result-card">

        <div id="resultIcon"
             class="result-icon">
            <i class="fa-solid fa-hands-clapping"></i>
        </div>

        <h1 id="resultTitle">
            အစမ်းစာမေးပွဲ ရလဒ်
        </h1>

        <p id="resultMessage">
            <i class="fa-regular fa-circle-down"></i>သင်၏ အစမ်းစာမေးပွဲရလဒ်ကို အောက်တွင်ကြည့်ရှုနိုင်ပါသည်။
        </p>


        <!-- Score -->

        <div class="result-score">

            <span id="score">
                <i class="fa-solid fa-trophy"></i>၀ / ၅၀
            </span>

            <small>
                ရမှတ်
            </small>

        </div>


        <!-- Percentage -->

        <div class="percentage">

            <span id="percentage">
                ၀%
            </span>

        </div>


        <!-- Status -->

        <div id="status"
             class="result-status">

            <i class="fa-regular fa-face-smile"></i>အောင်မြင်ပါသည်

        </div>


        <!-- Buttons -->

        <div class="result-buttons">

            <button id="retryBtn">
                <i class="fa-solid fa-rotate-right"></i> ပြန်လည်ဖြေဆိုရန်
            </button>

            <button id="homeBtn">
                <i class="fa-solid fa-house-chimney"></i> Portal သို့ပြန်သွားရန်
            </button>

        </div>

    </div>

</div>


<script src="mock-result.js"></script>

</body>

</html>
