<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Learn2Drive</title>
  <link rel="stylesheet" href="profile.css">
</head>

<body>
  <main class="profile-container">

    <section class="profile-section">
      <div class="profile-header">
        <img
          class="profile-pic"
          src="https://via.placeholder.com/100"
          alt="User profile picture"
        >

        <div>
          <h1>John Doe</h1>
          <p class="status-text">
            <span class="status-badge">Active</span>
          </p>
          <p class="member-since">Joined January 2024</p>
        </div>
      </div>
    </section>

    <section class="progress-section">
      <h2>Learning Progress</h2>

      <div class="progress-item">
        <div class="progress-header">
          <span>Knowledge Sharing</span>
          <span class="percentage">65%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 65%"></div>
        </div>
      </div>

      <div class="progress-item">
        <div class="progress-header">
          <span>Practice Tests</span>
          <span class="percentage">80%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 80%"></div>
        </div>
      </div>

      <div class="progress-item">
        <div class="progress-header">
          <span>Road Signs</span>
          <span class="percentage">45%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 45%"></div>
        </div>
      </div>
    </section>

    <section class="calendar-section" aria-labelledby="calendarTitle">
      <div class="calendar-header-section">
        <h2 id="calendarTitle">Activity Calendar</h2>

        <p class="streak-info">
          🔥 <strong id="streakDays">0</strong> day streak
        </p>
      </div>

      <div class="calendar">
        <div class="calendar-month-year">
          <button
            class="nav-btn"
            id="prevMonth"
            type="button"
            aria-label="Previous month"
          >
            &lt;
          </button>

          <div class="month-year-display">
            <span id="monthNumber"></span>
            <span class="separator">/</span>
            <span id="yearNumber"></span>
            <span id="monthName"></span>
          </div>

          <button
            class="nav-btn"
            id="nextMonth"
            type="button"
            aria-label="Next month"
          >
            &gt;
          </button>
        </div>

        <div
          class="calendar-grid"
          role="grid"
          aria-label="Monthly activity calendar"
        >
          <div class="day-name">Mon</div>
          <div class="day-name">Tue</div>
          <div class="day-name">Wed</div>
          <div class="day-name">Thu</div>
          <div class="day-name">Fri</div>
          <div class="day-name sat">Sat</div>
          <div class="day-name sun">Sun</div>

          <div id="calendarDays" style="display: contents"></div>
        </div>

        <div class="calendar-legend">
          <div class="legend-item">
            <span class="legend-box attended"></span>
            Attempted
          </div>

          <div class="legend-item">
            <span class="legend-box absent"></span>
            Not attending
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const months = [
      "January",
      "February",
      "March",
      "April",
      "May",
      "June",
      "July",
      "August",
      "September",
      "October",
      "November",
      "December"
    ];

    let currentDate = new Date();

    const attendance = JSON.parse(
      localStorage.getItem("learn2driveAttendance") || "{}"
    );

    function getDateKey(year, month, day) {
      return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }

    function getDefaultStatus(year, month, day) {
      const dateKey = getDateKey(year, month, day);
      let hash = 0;

      for (const character of dateKey) {
        hash = (hash * 31 + character.charCodeAt(0)) % 100;
      }

      return hash < 65;
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const firstDay = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Convert JavaScript Sunday-first format to Monday-first format.
      const startingOffset = (firstDay.getDay() + 6) % 7;

      document.getElementById("monthNumber").textContent = month + 1;
      document.getElementById("yearNumber").textContent = year;
      document.getElementById("monthName").textContent = months[month];

      const calendarDays = document.getElementById("calendarDays");
      calendarDays.innerHTML = "";

      // Add empty cells before the first day of the month.
      for (let i = 0; i < startingOffset; i++) {
        const emptyCell = document.createElement("div");

        emptyCell.className = "calendar-day empty";
        emptyCell.setAttribute("aria-hidden", "true");

        calendarDays.appendChild(emptyCell);
      }

      // Add every day of the current month.
      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = getDateKey(year, month, day);

        const attempted =
          attendance[dateKey] ?? getDefaultStatus(year, month, day);

        const dayCell = document.createElement("div");

        dayCell.className = `calendar-day ${
          attempted ? "attended" : "absent"
        }`;

        dayCell.textContent = day;
        dayCell.setAttribute("role", "gridcell");

        dayCell.setAttribute(
          "aria-label",
          `${months[month]} ${day}, ${year}: ${
            attempted ? "Attempted" : "Not attending"
          }`
        );

        calendarDays.appendChild(dayCell);
      }

      updateStreak();
    }

    function updateStreak() {
      let date = new Date();
      let streak = 0;

      while (streak < 365) {
        const dateKey = getDateKey(
          date.getFullYear(),
          date.getMonth(),
          date.getDate()
        );

        const attempted =
          attendance[dateKey] ??
          getDefaultStatus(
            date.getFullYear(),
            date.getMonth(),
            date.getDate()
          );

        if (!attempted) {
          break;
        }

        streak++;
        date.setDate(date.getDate() - 1);
      }

      document.getElementById("streakDays").textContent = streak;
    }

    document.getElementById("prevMonth").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
