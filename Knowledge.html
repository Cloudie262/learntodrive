<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Knowledge Sharing - Learn2Drive</title>

  <link rel="stylesheet" href="knowledge.css">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <!-- Page Header -->
  <header class="page-header">
    <div class="header-controls">
      <button id="lang-toggle" type="button" aria-label="Switch to Myanmar language">
        <img src="myanmar-flag.svg" alt="Myanmar flag">
      </button>
      <button id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
      </button>
    </div>
    <h1 data-i18n="page_title">Knowledge Sharing</h1>
  </header>


  <!-- Knowledge Sharing Boxes -->
  <main class="knowledge-container">

   
    <a href="1.html" class="knowledge-box">
      <img src="1.png">
      <h2 data-i18n="title_1">Oil-fouled Spark Plugs in Gasoline Engines</h2>
    </a>


  
    <a href="2.html" class="knowledge-box">
      <img src="2.png">
      <h2 data-i18n="title_2">Child Safety Lock (Child Lock)</h2>
    </a>


 
    <a href="3.html" class="knowledge-box">
      <img src="3.avif">
      <h2 data-i18n="title_3">Signs That Your Engine Oil Is Running Low</h2>
    </a>


    
    <a href="4.html" class="knowledge-box">
      <img src="4.png">
      <h2 data-i18n="title_4">Is Blue Smoke from the Exhaust a Problem?</h2>
    </a>



    <a href="5.html" class="knowledge-box">
      <img src="5.png">
      <h2 data-i18n="title_5">About Car Batteries</h2>
    </a>



    <a href="6.html" class="knowledge-box">
      <img src="6.png">
      <h2 data-i18n="title_6">Why Does the ABS Warning Light Come On?</h2>
    </a>

  </main>


  <!-- Footer -->
  <footer data-i18n="footer_text">
    © 2024 DriveLearn. All rights reserved.
  </footer>

  <script>
    const translations = {
      en: {
        page_title: "Knowledge Sharing",
        title_1: "Oil-fouled Spark Plugs in Gasoline Engines",
        title_2: "Child Safety Lock (Child Lock)",
        title_3: "Signs That Your Engine Oil Is Running Low",
        title_4: "Is Blue Smoke from the Exhaust a Problem?",
        title_5: "About Car Batteries",
        title_6: "Why Does the ABS Warning Light Come On?",
        footer_text: "© 2024 DriveLearn. All rights reserved."
      },
      my: {
        page_title: "အသိပညာ မျှဝေခြင်း",
        title_1: "ပက်ထရိုးအင်ဂျင်များတွင် အဆီစွန်းနေသော စပါ့ပ်ပလပ်များ",
        title_2: "ကလေးဘေးကင်းလုံခြုံရေး သော့ (Child Lock)",
        title_3: "အင်ဂျင်ဆီ လျော့နည်းနေကြောင်း ပြသော လက္ခဏာများ",
        title_4: "အိတ်ဇောမှ အပြာရောင်အခိုးထွက်ခြင်းသည် ပြဿနာတစ်ခုလော",
        title_5: "ကားဘက်ထရီအကြောင်း",
        title_6: "ABS သတိပေးမီး အဘယ်ကြောင့် လင်းရသနည်း",
        footer_text: "© 2024 DriveLearn. မူပိုင်ခွင့်အားလုံး ရယူထားသည်။"
      }
    };

    const langToggle = document.getElementById("lang-toggle");
    const themeToggle = document.getElementById("theme-toggle");
    let currentLanguage = localStorage.getItem("preferredLang") || "en";

    function applyLanguage(language) {
      currentLanguage = language;

      document.querySelectorAll("[data-i18n]").forEach(function (element) {
        const key = element.getAttribute("data-i18n");
        element.textContent = translations[currentLanguage][key];
      });

      document.documentElement.lang = currentLanguage === "my" ? "my" : "en";
      document.title = currentLanguage === "my"
        ? "အသိပညာ မျှဝေခြင်း - Learn2Drive"
        : "Knowledge Sharing - Learn2Drive";

      langToggle.innerHTML = currentLanguage === "en"
        ? '<img src="myanmar-flag.svg" alt="Myanmar flag">'
        : '<img src="uk-flag.svg" alt="United Kingdom flag">';
      langToggle.setAttribute(
        "aria-label",
        currentLanguage === "en" ? "Switch to Myanmar language" : "Switch to English language"
      );
      localStorage.setItem("preferredLang", currentLanguage);
    }

    applyLanguage(currentLanguage);

    langToggle.addEventListener("click", function () {
      applyLanguage(currentLanguage === "en" ? "my" : "en");
    });

    themeToggle.addEventListener("click", function () {
      const darkThemeEnabled = document.body.classList.toggle("dark-theme");
      const icon = themeToggle.querySelector("i");

      icon.className = darkThemeEnabled ? "fa-solid fa-sun" : "fa-solid fa-moon";
      themeToggle.setAttribute(
        "aria-label",
        darkThemeEnabled ? "Switch to light theme" : "Switch to dark theme"
      );
      localStorage.setItem("preferredTheme", darkThemeEnabled ? "dark" : "light");
    });

    if (localStorage.getItem("preferredTheme") === "dark") {
      document.body.classList.add("dark-theme");
      themeToggle.querySelector("i").className = "fa-solid fa-sun";
      themeToggle.setAttribute("aria-label", "Switch to light theme");
    }
  </script>

</body>
</html>
