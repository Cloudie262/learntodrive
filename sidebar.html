<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.2/css/boxicons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Toggle Button -->
  <button class="sidebar-toggle" id="sidebarToggle">
    <i class="fa-solid fa-bars"></i>
  </button>

  <!-- Sidebar -->
 <aside class="sidebar">



  <nav>
    <ul class="menu">
      <li><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>
      <li><a href="Knowledge.html"><i class="fa-solid fa-lightbulb"></i> Knowledge Sharing</a></li>
      <li><a href="portal.html"><i class="fa-solid fa-file-pen"></i> Practice Test</a></li>
      <li><a href="roadsign.html"><i class="fa-solid fa-triangle-exclamation"></i> Road Signs</a></li>
      <li><a href="hotline.html"><i class="fa-solid fa-phone"></i> Hotline</a></li>
      <li><a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a></li>
    </ul>
  </nav>
</aside>

<!-- Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<script>
    



    const sidebar = document.querySelector('.sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    

    // Open sidebar
    sidebarToggle.addEventListener('click', function() {
      sidebar.classList.add('active');
      sidebarOverlay.classList.add('active');
    });

    // Close sidebar
    function closeSidebar() {
      sidebar.classList.remove('active');
      sidebarOverlay.classList.remove('active');
    }

    sidebarOverlay.addEventListener('click', closeSidebar);

    // Close sidebar when clicking on menu items
    const menuItems = document.querySelectorAll('.sidebar .menu li a');
    menuItems.forEach(item => {
      item.addEventListener('click', closeSidebar);
    });
  </script>
</body>
</html>
